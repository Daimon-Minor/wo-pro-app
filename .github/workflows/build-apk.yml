name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode signing keystore (if secrets exist)
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        run: |
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | base64 -d > keystore.jks
            echo "KEYSTORE_FILE=keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASS=${{ secrets.KS_PASS }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KS_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.KS_ALIAS_PASS }}" >> $GITHUB_ENV
          else
            echo "No signing secrets — building with debug signing (APK installable)"
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wo-pro-release
          path: app/build/outputs/apk/release/*.apk